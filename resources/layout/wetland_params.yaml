# Formulario de edición de los 20 parámetros de la sección "Wetland
# inputs" de un .pnd, escritos directamente sobre el archivo real (no una
# copia) por la ventana de edición de humedales.
#
# "verify_range: true" marca campos cuyo límite superior no está
# confirmado contra la documentación de SWAT2012 I/O: por ahora solo se
# valida que sean >= 0. Mismo criterio que ya usaba el wetland_pond.yaml
# original de este proyecto para los 7 campos "core".

form: wetland_params
fields:
  - id: wet_fr
    label_key: wetland.wet_fr
    range: [0.0, 1.0]

  - id: wet_nsa
    label_key: wetland.wet_nsa
    range: [0.0, null]
    verify_range: true

